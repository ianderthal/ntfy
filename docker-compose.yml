services:
  ntfy:
    image: binwiederhier/ntfy:v2.29.0
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      TZ: America/Detroit
      NTFY_BASE_URL: ${NTFY_BASE_URL:?Set NTFY_BASE_URL in the Portainer stack environment variables}
      NTFY_BEHIND_PROXY: "true"
      # Keeps messages across restarts so clients can catch up on what they missed
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Only needed for instant notifications on iPhone
      # NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - /opt/docker/ntfy:/var/lib/ntfy
    networks:
      - proxy

networks:
  proxy:
    name: proxy_network
    external: true
